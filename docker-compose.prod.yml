services:
  fleetmaster:
    build:
      context: .
      dockerfile: Dockerfile
    image: fleetmaster-hub:latest
    # Caddy (edge-caddy) resuelve este nombre: no cambiar
    container_name: fleetmaster
    restart: unless-stopped
    expose:
      - "3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
    env_file:
      - backend/.env.prod
    volumes:
      - uploads:/app/backend/public/uploads
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3001/api/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - fleetmaster-network
      - edge

volumes:
  uploads:
    driver: local
    # volumen real con las fotos/documentos en el VPS
    name: fleetmasterhub_uploads

networks:
  fleetmaster-network:
    driver: bridge
  # red de edge-caddy (creada fuera de este stack)
  edge:
    external: true
